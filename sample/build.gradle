apply plugin: 'com.android.application'

def zealotProp = { String key, String defVal ->
    try {
        def f = rootProject.file('local.properties')
        if (f.exists()) {
            def p = new Properties()
            p.load(f.newDataInputStream())
            def v = p.getProperty(key)
            if (v != null && v.trim()) return v.trim()
        }
    } catch (Throwable ignored) {
    }
    return defVal
}

android {
    compileSdkVersion 32
    buildToolsVersion "30.0.3"
    defaultConfig {
        applicationId "com.vector.appupdatedemo2"
        minSdkVersion 21
        targetSdkVersion 32
        versionCode 1
        versionName "0.1.0"
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'zealot_endpoint', '"' + zealotProp('zealot_endpoint', 'https://appstore.timefly.art') + '"'
        buildConfigField 'String', 'zealot_channel_key', '"' + zealotProp('zealot_channel_key', '') + '"'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        debug{
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
    }
    packagingOptions {
        exclude '**/META-INF/DEPENDENCIES'
        exclude 'lib/**/libadblockplus-jni.so'
        exclude 'lib/**/libavif_decoder.so'
    }
}

dependencies {

    implementation project(path: ':update-default')
    // implementation project(path: ':update-pyger')  // 与 zealot 二选一，勿同时 Startup
    implementation project(path: ':update-zealot')


    implementation 'androidx.multidex:multidex:2.0.0'

    //org.jetbrains.kotlin:kotlin-stdlib

//    compile project(':update-app')

    api project(':http')

    api project(':update-default')
    api project(':feedback')

    //compile 'com.qianwen:update-app-kotlin:1.1.0'
    //okgo
    //rxjava 1
    api 'androidx.palette:palette:1.0.0'
    //权限引导
    api 'androidx.appcompat:appcompat:1.0.0'

    api 'androidx.constraintlayout:constraintlayout:1.1.3'

    api 'com.qianwen:okhttp-utils:3.8.0'

    api 'com.lzy.net:okgo:3.0.4'

    api 'io.reactivex:rxjava:1.2.9'

    api 'io.reactivex:rxandroid:1.2.0'
    api 'com.tbruyelle.rxpermissions:rxpermissions:0.9.4@aar'

}
configurations {
    all*.exclude group: 'com.github.skyNet2017.AppUpdate' //, module: 'utilcode'
}
